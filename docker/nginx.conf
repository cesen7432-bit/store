# La tienda se publica en la subruta /store/ (https://apps-cecom.cloud/store/).
# El Nginx del servidor reenvía /store/ a este contenedor (ver README).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 80m;   # fotos, videos de proyectos y adjuntos de cotizaciones
  server_tokens off;
  absolute_redirect off;      # redirecciones relativas (funciona detrás del proxy del servidor)

  # DNS interno de Docker: vuelve a resolver "api" si el contenedor se recrea
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:4000;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = / { return 302 /store/; }
  location = /store { return 301 /store/; }

  # API → backend (se quita el prefijo /store)
  location /store/api/ {
    rewrite ^/store/(.*)$ /$1 break;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # fotos y videos subidos → backend
  location /store/uploads/ {
    rewrite ^/store/(.*)$ /$1 break;
    proxy_pass $api_upstream;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # archivos con hash: caché larga
  location /store/assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA: cualquier otra ruta bajo /store/ → index.html
  location /store/ {
    try_files $uri $uri/ /store/index.html;
  }
}
